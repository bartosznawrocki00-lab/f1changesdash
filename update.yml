name: Aktualizacja danych FIA
on:
  schedule:
    - cron: "0 */6 * * 3-6"   # co 6 h od środy do soboty (tygodnie wyścigowe)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python update.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIA_DOCS_URL: ${{ vars.FIA_DOCS_URL }}
      - name: Zapisz bazę w repo
        run: |
          git config user.name "bot" && git config user.email "bot@users.noreply.github.com"
          git add data/upgrades.db
          git diff --staged --quiet || (git commit -m "Aktualizacja danych" && git push)
